[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudforge-auth-core"
version = "1.1.5"
description = "Shared JWT verification and scope enforcement implementing CloudForge Identity Contract v1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
