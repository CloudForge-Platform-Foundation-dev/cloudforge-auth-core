[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudforge-auth-core"
version = "1.1.0"
description = "Shared JWT verification and scope enforcement for CloudForge Studios (Identity Contract v1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "CloudForge Platform" }]
dependencies = [
    "PyJWT[crypto]>=2.8",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "cryptography>=42",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
