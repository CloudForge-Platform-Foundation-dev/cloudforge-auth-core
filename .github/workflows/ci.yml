# DRAFT for cloudforge-auth-core -> target path: .github/workflows/ci.yml
# Status: NOT pushed anywhere. Read it, then decide whether to open a PR.
#
# Modelled on cloudforge-identity-service's ci.yml (pytest + gitleaks), with:
#   - top-level least-privilege permissions
#   - a Python matrix, because pyproject.toml says requires-python >= 3.10
#     (lowered to 3.10 in v1.1.4 for Knowledge CI) while Identity tests on 3.11
#   - httpx installed explicitly: the tests use fastapi's TestClient, which
#     needs httpx, and httpx is not listed in the [dev] extra of pyproject.toml
#
# Deliberately NOT included: the identity-contract validator job used by
# Identity. That validator is written for token-issuing services, and it has
# not been read yet, so it should not be assumed to fit a library.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" httpx
      - name: Run tests
        run: pytest tests/ -v

  # Same pinned, checksum-verified gitleaks CLI as cloudforge-identity-service.
  # The version and SHA-256 below were copied from that repo's ci.yml (they
  # pass sha256sum -c there); they were not re-checked against the official
  # release checksums file. Scans the full git history; --redact keeps secret
  # values out of the logs.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --no-banner .
